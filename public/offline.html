<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <title>Sin conexión — EduColor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      body {
        font-family: system-ui;
        text-align: center;
        padding: 3rem;
        background: #f8f7ff;
        color: #333;
        margin: 0;
      }
      .icon {
        font-size: 4rem;
        margin-bottom: 1rem;
      }
      h1 {
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0 0 1.5rem;
        max-width: 400px;
        margin-left: auto;
        margin-right: auto;
      }
      button {
        margin-top: 1.5rem;
        padding: 0.75rem 1.5rem;
        font-size: 1rem;
        background: #5b4bdb;
        color: #fff;
        border: none;
        border-radius: 0.5rem;
        cursor: pointer;
      }
      button:hover {
        background: #4a3bc5;
      }
    </style>
  </head>
  <body>
    <div class="icon">📶</div>
    <h1>Estás sin conexión</h1>
    <p>EduColor funciona offline, pero esta pantalla necesita recargar.</p>
    <button onclick="window.location.reload()">Reintentar</button>
    <script>
      window.addEventListener("online", () => window.location.reload());
    </script>
  </body>
</html>
